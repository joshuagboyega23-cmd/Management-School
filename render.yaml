services:
  - type: web
    name: pinnacle-heights-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # You will set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # You will set this manually in Render dashboard
      - key: CLIENT_URL
        sync: false  # You will set this to your Vercel frontend URL

